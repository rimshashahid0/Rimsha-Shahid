<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Rimsha Shahid</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* Contact Hero */
    .contact-hero {
      text-align: center;
      padding: 3rem 1rem 2rem;
      background: #d6e0ea;
    }

.contact-hero h1{
    font-size: 2.5rem;
    margin-bottom: 1rem;
}

    .dark .contact-hero {
      background: #1e1e1e;
    }

    /* Contact Form */
    .contact-form-section {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .contact-form input,
    .contact-form textarea {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      background-color: #d6e0ea;
    }
    .contact-form textarea {
      resize: vertical;
      min-height: 150px;
    }

.contact-form label{
    font-weight: bold;
}

    .contact-form button {
      padding: 0.8rem;
      background: #00c2b2;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
    }
    .contact-form button:hover {
      background: #00c2b2;
    }
    .dark .contact-form input,
    .dark .contact-form textarea {
      background: #1a1a1a;
      color: white;
      border: 1px solid #444;
    }



  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Rimsha Shahid</a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><button id="themeToggle"><i class="fas fa-adjust"></i></button></li>
      </ul>
    </nav>
  </header>

  
  <section class="contact-hero">
    <h1>Contact Me</h1>
    <p>Have a project in mind or want to work together? Send me a message!</p>
  </section>


  <section class="contact-form-section">
   <form id="contactForm" class="contact-form">
    <div id="formStatus" style="margin-bottom: 1rem; color: green; display: none;"></div>

      <label for="name">Name</label>
      <input type="text" name="name" id="name" required />

      <label for="email">Email</label>
      <input type="email" name="email" id="email" required />

      <label for="message">Message</label>
      <textarea name="message" id="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </section>



  <footer class="footer">
    <p>&copy; 2025 Rimsha Shahid. All rights reserved.</p>
    <p>Contact: <a href="mailto:rimshashahid0786@gmail.com">rimshashahid0786@gmail.com</a></p>
    <p>Connect with me:
      <a href="https://github.com/rimshashahid0" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://linkedin.com/in/rimsha-shahid-874002343" target="_blank"><i class="fab fa-linkedin"></i></a>
    </p>
  </footer>
  

  <script>
    // Theme toggle
    document.getElementById("themeToggle").addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });
  
    // Form submission
    const form = document.getElementById("contactForm");
    const status = document.getElementById("formStatus");
  
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
  
      try {
        const response = await fetch("https://formspree.io/f/manoqazw", {
          method: "POST",
          headers: {
            "Accept": "application/json"
          },
          body: formData
        });
  
        if (response.ok) {
          status.innerText = "Thanks! Your message has been sent.";
          status.style.display = "block";
          form.reset();
        } else {
          status.innerText = "Oops! Something went wrong. Please try again.";
          status.style.color = "red";
          status.style.display = "block";
        }
      } catch (error) {
        status.innerText = "Network error. Please try again.";
        status.style.color = "red";
        status.style.display = "block";
      }
    });
  </script>
  
</body>
</html>
